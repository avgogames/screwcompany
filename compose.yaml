# Local Postgres for development: `podman compose up -d`
services:
  db:
    # Fully qualified image name so Podman doesn't prompt for a registry
    image: docker.io/library/postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: screwcompany
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
